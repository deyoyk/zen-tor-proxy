name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: "24.19.0"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx esbuild dist/index.js --bundle --platform=node --format=cjs --target=node20 --outfile=dist/bundle.cjs
      - name: Build linux x64
        run: node scripts/build-exe.cjs linux x64
      - name: Fetch node for linux arm64
        run: |
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-linux-arm64.tar.gz" -o /tmp/node-arm64.tar.gz
          tar -xzf /tmp/node-arm64.tar.gz -C /tmp
      - name: Build linux arm64
        run: node scripts/build-exe.cjs linux arm64 "/tmp/node-v${{ env.NODE_VERSION }}-linux-arm64/bin/node" reuse
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/zen-tor-proxy-linux-*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx esbuild dist/index.js --bundle --platform=node --format=cjs --target=node20 --outfile=dist/bundle.cjs
      - name: Build macos arm64
        run: node scripts/build-exe.cjs macos arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/zen-tor-proxy-macos-*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx esbuild dist/index.js --bundle --platform=node --format=cjs --target=node20 --outfile=dist/bundle.cjs
      - name: Build windows x64
        run: node scripts/build-exe.cjs windows x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/zen-tor-proxy-windows-*
          if-no-files-found: error

  release:
    # Releases on tagged pushes (manual v* releases) and on every push to main
    # (auto-bumped patch release so installers always get the latest build).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Auto-bump the patch version from the latest existing release.
            LATEST="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
            if [[ "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              MAJOR=1
              MINOR=0
              PATCH=0
            fi
            while true; do
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
              gh release view "$TAG" >/dev/null 2>&1 || break
            done
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Releasing $TAG"
          gh release create "$TAG" dist/* --title "$TAG" \
            --notes "Automated build of zen-tor-proxy $TAG" --target "$GITHUB_SHA"
